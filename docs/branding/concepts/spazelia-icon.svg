<title id="spazelia-icon-title">Simbolo Spazelia</title>
<desc id="spazelia-icon-desc">Due angoli morbidi e aperti incorniciano uno spazio libero. L’arancio è un accento piccolo: l’ordine resta il protagonista.</desc>
